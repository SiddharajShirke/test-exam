name: Deploy & CI Pipeline

on:
  push:
    branches:
      - main
      - 'phase/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Fast Gate: Runs on every push and PR (< 3 minutes) ──────────────────────
  fast:
    name: Fast Verification (Lint, Typecheck, Unit Tests, Shellcheck, Plan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install api dependencies
        run: |
          cd api
          npm ci

      - name: ESLint
        run: |
          cd api
          npm run lint

      - name: Typecheck
        run: |
          cd api
          npm run typecheck

      - name: Unit Tests & Phase 1 Checks
        run: |
          cd api
          npm run test:unit

      - name: Contract Tests
        run: |
          cd api
          npm run test:contract

      - name: Shellcheck infra and scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 infra/azure/*.sh infra/azure/discovery/*.sh scripts/*.sh

      - name: Dry-Run Provisioning Plan Check
        run: |
          bash scripts/run-plan.sh

  # ── Security Gate: npm audit & gitleaks ──────────────────────────────────────
  security:
    name: Security Gate (Audit & Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit production dependencies
        run: |
          cd api
          npm audit --omit=dev --audit-level=high || true
