name: Nightly Maintenance & Smoke Tests

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-fast:
    name: Nightly Fast Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: |
          cd api
          npm ci

      - name: Run all tests
        run: |
          cd api
          npm test

  nightly-azure:
    name: Nightly Azure Smoke (when enabled)
    needs: nightly-fast
    runs-on: ubuntu-latest
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Container App Status
        run: |
          az containerapp show \
            --name assess-api \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{name:name,provisioningState:properties.provisioningState,fqdn:properties.configuration.ingress.fqdn}" -o json
